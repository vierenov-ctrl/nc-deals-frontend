<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — NC Deals</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    header { background: #333; color: white; padding: 20px; text-align: center; }
    nav { background: #222; padding: 10px; text-align: center; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
    .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    h2 { color: #333; margin-bottom: 20px; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .photo-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .photo-card img { width: 100%; height: 200px; object-fit: cover; }
    .photo-card .actions { padding: 15px; }
    .photo-card p { font-size: 0.85rem; color: #666; margin-bottom: 10px; word-break: break-all; }
    .btn-ok { background: #00843D; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-right: 8px; }
    .btn-nok { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
    .badge-attente { background: #ffc107; color: #333; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
    .vide { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>
  <header><h1>Panneau Admin — Modération photos</h1></header>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="fournisseur.html">Espace fournisseur</a>
    <a href="admin.html">Admin</a>
  </nav>
  <div class="container">
    <h2>Photos en attente de modération <span class="badge-attente" id="compteur">0</span></h2>
    <div class="photo-grid" id="photos-container">
      <p>Chargement...</p>
    </div>
  </div>
  <script>
    const BACKEND = 'https://nc-deals-backend-production.up.railway.app';

    async function chargerPhotos() {
      try {
        const res = await fetch(BACKEND + '/api/admin/photos');
        const photos = await res.json();
        document.getElementById('compteur').textContent = photos.length;
        const container = document.getElementById('photos-container');
        if (photos.length === 0) {
          container.innerHTML = '<div class="vide">Aucune photo en attente. Tout est modéré !</div>';
          return;
        }
        container.innerHTML = photos.map(p => `
          <div class="photo-card" id="card-${p.id}">
            <img src="${p.url}" alt="Photo à modérer">
            <div class="actions">
              <p>ID : ${p.public_id}</p>
              <button class="btn-ok" onclick="moderer('${p.public_id}', 'approuver', ${p.id})">Approuver</button>
              <button class="btn-nok" onclick="moderer('${p.public_id}', 'refuser', ${p.id})">Refuser</button>
            </div>
          </div>
        `).join('');
      } catch(e) {
        document.getElementById('photos-container').innerHTML = '<p>Erreur de connexion au backend.</p>';
      }
    }

    async function moderer(publicId, action, cardId) {
      await fetch(BACKEND + '/api/upload/moderate/' + publicId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action })
      });
      document.getElementById('card-' + cardId).remove();
      const restant = document.querySelectorAll('.photo-card').length;
      document.getElementById('compteur').textContent = restant;
      if (restant === 0) {
        document.getElementById('photos-container').innerHTML = '<div class="vide">Aucune photo en attente. Tout est modéré !</div>';
      }
    }

    chargerPhotos();
  </script>
</body>
</html>
