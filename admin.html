<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin — NC Deals</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
    header { background: #1a1a2e; color: white; padding: 16px 24px; }
    header h1 { margin: 0; font-size: 1.4rem; }
    nav { background: #16213e; padding: 10px 24px; }
    nav a { color: #ccc; text-decoration: none; margin-right: 20px; font-size: 0.95rem; }
    nav a:hover { color: white; }
    .container { max-width: 1000px; margin: 30px auto; padding: 0 16px; }
    h2 { font-size: 1.2rem; margin-bottom: 16px; }
    #compteur { background: #f0a500; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.9rem; margin-left: 8px; }
    .photo-card { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: flex; gap: 16px; align-items: flex-start; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .photo-card img { width: 160px; height: 120px; object-fit: cover; border-radius: 6px; }
    .photo-info { flex: 1; }
    .photo-info p { margin: 4px 0; font-size: 0.9rem; color: #555; }
    .btn-approuver { background: #27ae60; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; margin-right: 10px; font-size: 0.9rem; }
    .btn-refuser { background: #e74c3c; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .vide { color: #888; font-style: italic; margin-top: 20px; }
    #chargement { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <header><h1>Panneau Admin — Modération photos</h1></header>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="fournisseur.html">Espace fournisseur</a>
    <a href="admin.html">Admin</a>
  </nav>
    <div style="max-width:1000px;margin:30px auto;padding:0 16px;">
    <h2 style="font-size:1.2rem;margin-bottom:16px;">Moderation des offres</h2>
    <div id="liste-offres"></div>
  </div>
  <div class="container">
    <h2>Photos en attente de modération <span id="compteur">0</span></h2>
    <div id="photos-container"><p id="chargement">Chargement...</p></div>
  </div>
  <!-- GESTION FOURNISSEURS -->
  <div class="container-admin" id="section-fournisseurs" style="max-width:1000px;margin:30px auto;padding:0 16px;display:none">
    <h2 style="font-size:1.2rem;margin-bottom:16px;">Comptes fournisseurs</h2>
    <div id="liste-fournisseurs"></div>
  </div>
  <script>
    const BACKEND = 'https://nc-deals-backend-production.up.railway.app';
    const ADMIN_KEY = prompt('Clé admin :') || '';
    async function chargerOffres() {
  const res = await fetch(BACKEND + '/api/admin/offres?admin_key=' + encodeURIComponent(ADMIN_KEY));
  if (!res.ok) return;
  const offres = await res.json();
  const container = document.getElementById('liste-offres');
  if (!container) return;
  if (offres.length === 0) { container.innerHTML = '<p>Aucune offre.</p>'; return; }
  container.innerHTML = '';
  offres.forEach(function(o) {
    var couleur = o.statut === 'approuvee' ? '#27ae60' : o.statut === 'refusee' ? '#e74c3c' : '#f0a500';
    var photo = o.photo_url ? '<img src="' + o.photo_url + '" style="width:100px;height:80px;object-fit:cover;border-radius:6px;">' : '<div style="width:100px;height:80px;background:#eee;border-radius:6px;"></div>';
    var div = document.createElement('div');
    div.style = 'background:white;padding:16px;margin-bottom:12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.1);display:flex;gap:16px;align-items:flex-start;';
    div.innerHTML = photo +
      '<div style="flex:1"><strong>' + o.titre + '</strong> — ' + (o.fournisseur_nom || 'Inconnu') + '<br>' +
      '<small style="color:#888">' + (o.description || '') + ' | ' + (o.prix_xpf ? o.prix_xpf + ' XPF' : '') + '</small><br>' +
      '<span style="background:' + couleur + ';color:white;padding:2px 8px;border-radius:10px;font-size:0.8rem;">' + o.statut + '</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:6px;">' +
      '<button onclick="changerStatutOffre(' + o.id + ',\'approuvee\')" style="background:#27ae60;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;">Approuver</button>' +
      '<button onclick="changerStatutOffre(' + o.id + ',\'refusee\')" style="background:#e74c3c;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;">Refuser</button>' +
      '<button onclick="changerStatutOffre(' + o.id + ',\'en_attente\')" style="background:#888;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;">En attente</button></div>';
    container.appendChild(div);
  });
}

    async function changerStatutOffre(id, statut) {
      await fetch(BACKEND + '/api/admin/offres/' + id + '/statut', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_key: ADMIN_KEY, statut: statut })
      });
      chargerOffres();
    }
    async function chargerFournisseurs() {
      const res = await fetch(BACKEND + '/api/admin/fournisseurs?admin_key=' + encodeURIComponent(ADMIN_KEY));
      if (!res.ok) { alert('Cle admin incorrecte.'); return; }
      const fournisseurs = await res.json();
      const container = document.getElementById('liste-fournisseurs');
      if (fournisseurs.length === 0) { container.innerHTML = '<p>Aucun fournisseur.</p>'; return; }
      container.innerHTML = fournisseurs.map(f => `
        <div style="background:white;padding:16px;margin-bottom:12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.1);display:flex;justify-content:space-between;align-items:center;">
          <div>
            <strong>${f.nom}</strong> — ${f.email}<br>
            <small style="color:#888">IBAN: ${f.iban || 'non renseigne'} | Inscrit le: ${new Date(f.cree_le).toLocaleDateString('fr-FR')}</small>
          </div>
          <div>
            <span style="background:${f.actif ? '#27ae60' : '#e74c3c'};color:white;padding:4px 10px;border-radius:12px;font-size:0.85rem;margin-right:10px">${f.actif ? 'Actif' : 'Inactif'}</span>
            <button onclick="toggleFournisseur(${f.id}, ${f.actif})" style="background:${f.actif ? '#e74c3c' : '#27ae60'};color:white;border:none;padding:6px 14px;border-radius:6px;cursor:pointer">${f.actif ? 'Desactiver' : 'Activer'}</button>
          </div>
        </div>
      `).join('');
      document.getElementById('section-fournisseurs').style.display = 'block';
    }

    async function toggleFournisseur(id, actifActuel) {
      await fetch(BACKEND + '/api/admin/fournisseurs/' + id + '/statut', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_key: ADMIN_KEY, actif: !actifActuel })
      });
      chargerFournisseurs();
      chargerOffres();
    }
    async function chargerPhotos() {
      try {
        const res = await fetch(BACKEND + '/api/admin/photos');
        const photos = await res.json();
        document.getElementById('compteur').textContent = photos.length;
        const container = document.getElementById('photos-container');
        if (photos.length === 0) {
          container.innerHTML = '<div class="vide">Aucune photo en attente. Tout est modéré !</div>';
          return;
        }
        container.innerHTML = '';
        photos.forEach(photo => {
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.id = 'card-' + photo.id;
          card.innerHTML = `
            <img src="${photo.url}" alt="Photo">
            <div class="photo-info">
              <p><strong>ID photo :</strong> ${photo.id}</p>
              <p><strong>Offre :</strong> ${photo.offre_id || 'Non liée'}</p>
              <p><strong>Ajoutée le :</strong> ${new Date(photo.cree_le).toLocaleString('fr-FR')}</p>
              <div style="margin-top:12px;">
                <button class="btn-approuver" onclick="moderer('${photo.public_id}', 'approuver', ${photo.id})">Approuver</button>
                <button class="btn-refuser" onclick="moderer('${photo.public_id}', 'refuser', ${photo.id})">Refuser</button>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        document.getElementById('photos-container').innerHTML = '<div class="vide">Erreur de chargement : ' + e.message + '</div>';
      }
    }

    async function moderer(publicId, action, cardId) {
      try {
        const res = await fetch(BACKEND + '/api/upload/moderate/' + encodeURIComponent(publicId), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action })
        });
        if (!res.ok) {
          const err = await res.text();
          alert('Erreur serveur : ' + err);
          return;
        }
        document.getElementById('card-' + cardId).remove();
        const restant = document.querySelectorAll('.photo-card').length;
        document.getElementById('compteur').textContent = restant;
        if (restant === 0) {
          document.getElementById('photos-container').innerHTML = '<div class="vide">Aucune photo en attente. Tout est modéré !</div>';
        }
      } catch (e) {
        alert('Erreur réseau : ' + e.message);
      }
    }

    chargerPhotos();
    chargerFournisseurs(); 
  </script>
</body>
</html>
