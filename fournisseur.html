<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Fournisseur — NC Deals</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    header { background: #00843D; color: white; padding: 20px; text-align: center; }
    nav { background: #006830; padding: 10px; text-align: center; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
    .container { max-width: 700px; margin: 30px auto; padding: 0 20px; }
    .card { background: white; border-radius: 10px; padding: 25px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #00843D; margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; font-size: 1rem; }
    button { background: #00843D; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #006830; }
    .upload-zone { border: 2px dashed #00843D; border-radius: 10px; padding: 30px; text-align: center; cursor: pointer; margin-bottom: 15px; }
    .upload-zone:hover { background: #f0fff4; }
    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .preview-grid img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }
    .msg { padding: 10px; border-radius: 6px; margin-top: 10px; display: none; }
    .msg.ok { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #f8d7da; color: #721c24; display: block; }
    .progress { height: 8px; background: #ddd; border-radius: 4px; margin-top: 10px; display: none; }
    .progress-bar { height: 100%; background: #00843D; border-radius: 4px; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>
  <header><h1>Espace Fournisseur</h1></header>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="fournisseur.html">Espace fournisseur</a>
    <a href="admin.html">Admin</a>
  </nav>
  <div class="container">

    <div class="card">
      <h2>Mon profil fournisseur</h2>
      <label>Nom / Entreprise</label>
      <input type="text" id="nom" placeholder="Ex: Boucherie Dupont">
      <label>Email</label>
      <input type="email" id="email" placeholder="contact@monentreprise.nc">
      <label>IBAN</label>
      <input type="text" id="iban" placeholder="FR76 XXXX XXXX XXXX XXXX XXXX XXX">
      <label>BIC</label>
      <input type="text" id="bic" placeholder="BNPAFRPP">
      <button onclick="sauvegarderProfil()">Enregistrer mon profil</button>
      <div class="msg" id="msg-profil"></div>
    </div>

    <div class="card" id="section-offre" style="display:none">
      <h2>Ajouter une offre</h2>
      <label>Titre de l'offre</label>
      <input type="text" id="titre" placeholder="Ex: Paella geante pour 10 personnes">
      <label>Description</label>
      <textarea id="description" rows="3" placeholder="Decrivez votre offre..."></textarea>
      <label>Prix (XPF)</label>
      <input type="number" id="prix" placeholder="Ex: 3500">
      <label>Photos de l'offre</label>
      <div class="upload-zone" onclick="document.getElementById('photos-input').click()">
        Cliquez ici pour ajouter des photos
      </div>
      <input type="file" id="photos-input" multiple accept="image/*" style="display:none" onchange="apercuPhotos(this)">
      <div class="preview-grid" id="apercu"></div>
      <div class="progress" id="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
      <br>
      <button onclick="publierOffre()">Publier l'offre</button>
      <div class="msg" id="msg-offre"></div>
    </div>

  </div>
  <script>
    const BACKEND = 'https://nc-deals-backend-production.up.railway.app';
    let fournisseurId = null;
    let fichiers = [];

    function afficherMsg(id, texte, type) {
      const el = document.getElementById(id);
      el.textContent = texte;
      el.className = 'msg ' + type;
    }

    async function sauvegarderProfil() {
      const nom = document.getElementById('nom').value.trim();
      const email = document.getElementById('email').value.trim();
      const iban = document.getElementById('iban').value.trim();
      const bic = document.getElementById('bic').value.trim();
      if (!nom || !email) { afficherMsg('msg-profil', 'Nom et email obligatoires.', 'err'); return; }
      try {
        const res = await fetch(BACKEND + '/api/fournisseurs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nom, email, iban, bic })
        });
        const data = await res.json();
        fournisseurId = data.id;
        afficherMsg('msg-profil', 'Profil enregistre ! Vous pouvez maintenant ajouter une offre.', 'ok');
        document.getElementById('section-offre').style.display = 'block';
      } catch(e) {
        afficherMsg('msg-profil', 'Erreur de connexion.', 'err');
      }
    }

    function apercuPhotos(input) {
      fichiers = Array.from(input.files);
      const apercu = document.getElementById('apercu');
      apercu.innerHTML = '';
      fichiers.forEach(function(f) {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        apercu.appendChild(img);
      });
    }

        async function uploaderPhoto(fichier) {
      const form = new FormData();
      form.append('file', fichier);
      form.append('upload_preset', 'nc-deals-offres');
      const upRes = await fetch('https://api.cloudinary.com/v1_1/dphws2zzq/image/upload', {
        method: 'POST',
        body: form
      });
      return await upRes.json();
    }

    async function publierOffre() {
      if (!fournisseurId) { afficherMsg('msg-offre', 'Enregistrez dabord votre profil.', 'err'); return; }
      const titre = document.getElementById('titre').value.trim();
      if (!titre) { afficherMsg('msg-offre', 'Le titre est obligatoire.', 'err'); return; }
      try {
        const offreRes = await fetch(BACKEND + '/api/offres', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fournisseur_id: fournisseurId,
            titre: titre,
            description: document.getElementById('description').value,
            prix_xpf: document.getElementById('prix').value || null
          })
        });
        const offre = await offreRes.json();
               if (fichiers.length > 0) {
          document.getElementById('progress-bar-wrap').style.display = 'block';
          for (let i = 0; i < fichiers.length; i++) {
            document.getElementById('progress-bar').style.width = ((i+1)/fichiers.length*100) + '%';
            const uploaded = await uploaderPhoto(fichiers[i]);
            await fetch(BACKEND + '/api/photos/save', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                public_id: uploaded.public_id,
                url: uploaded.secure_url,
                offre_id: offre.id
              })
            });
          }
        }
        afficherMsg('msg-offre', 'Offre publiee ! Les photos sont en attente de moderation.', 'ok');
        document.getElementById('progress-bar-wrap').style.display = 'none';
      } catch(e) {
        afficherMsg('msg-offre', 'Erreur lors de la publication.', 'err');
      }
    }
  </script>
</body>
</html>
