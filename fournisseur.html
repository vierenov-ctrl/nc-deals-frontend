<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Espace Fournisseur — NC Deals</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
    header { background: #1a6b3a; color: white; padding: 16px 24px; }
    header h1 { margin: 0; font-size: 1.4rem; }
    nav { background: #145c30; padding: 10px 24px; }
    nav a { color: #ccc; text-decoration: none; margin-right: 20px; font-size: 0.95rem; }
    nav a:hover { color: white; }
    .container { max-width: 600px; margin: 40px auto; background: white; padding: 32px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #1a6b3a; }
    label { display: block; margin-top: 14px; font-size: 0.9rem; color: #444; }
    input, textarea { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
    button { margin-top: 20px; background: #1a6b3a; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #145c30; }
    .lien { margin-top: 16px; font-size: 0.9rem; color: #555; }
    .lien a { color: #1a6b3a; cursor: pointer; text-decoration: underline; }
    .erreur { color: #e74c3c; margin-top: 10px; font-size: 0.9rem; }
    .succes { color: #27ae60; margin-top: 10px; font-size: 0.9rem; }
    .bandeau { background: #eafaf1; border: 1px solid #a9dfbf; padding: 12px 16px; border-radius: 6px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .btn-deconnexion { background: #e74c3c; padding: 6px 14px; font-size: 0.85rem; margin-top: 0; }
    .btn-deconnexion:hover { background: #c0392b; }
  </style>
</head>
<body>
  <header><h1>NC Deals — Espace Fournisseur</h1></header>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="fournisseur.html">Espace fournisseur</a>
    <a href="admin.html">Admin</a>
  </nav>

  <!-- ECRAN CONNEXION -->
  <div class="container" id="section-login">
    <h2>Connexion</h2>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="votre@email.com">
    <label>Mot de passe</label>
    <input type="password" id="login-password" placeholder="••••••••">
    <div class="erreur" id="login-erreur"></div>
    <button onclick="seConnecter()">Se connecter</button>
    <div class="lien">Pas encore de compte ? <a onclick="afficherInscription()">Créer un compte</a></div>
  </div>

  <!-- ECRAN INSCRIPTION -->
  <div class="container" id="section-register" style="display:none">
    <h2>Créer un compte fournisseur</h2>
    <label>Nom / Entreprise</label>
    <input type="text" id="reg-nom" placeholder="Votre nom ou entreprise">
    <label>Email</label>
    <input type="email" id="reg-email" placeholder="votre@email.com">
    <label>Mot de passe</label>
    <input type="password" id="reg-password" placeholder="Choisissez un mot de passe">
    <label>IBAN (optionnel)</label>
    <input type="text" id="reg-iban" placeholder="NC00 0000 0000 0000 0000">
    <label>BIC (optionnel)</label>
    <input type="text" id="reg-bic" placeholder="BPNCNCNX">
    <div class="erreur" id="register-erreur"></div>
    <button onclick="sInscrire()">Créer mon compte</button>
    <div class="lien">Déjà un compte ? <a onclick="afficherConnexion()">Se connecter</a></div>
  </div>

  <!-- TABLEAU DE BORD -->
  <div class="container" id="section-dashboard" style="display:none">
    <div class="bandeau">
      <span>Bonjour <strong id="nom-fournisseur"></strong> !</span>
      <button class="btn-deconnexion" onclick="seDeconnecter()">Déconnexion</button>
    </div>

    <!-- Formulaire offre -->
    <div id="section-offre">
      <h2>Publier une offre</h2>
      <label>Titre de l'offre</label>
      <input type="text" id="offre-titre" placeholder="Ex : Réparation smartphone">
      <label>Description</label>
      <textarea id="offre-description" rows="3" placeholder="Décrivez votre offre..."></textarea>
      <label>Prix (XPF)</label>
      <input type="number" id="offre-prix" placeholder="Ex : 5000">
      <div class="erreur" id="offre-erreur"></div>
      <button onclick="publierOffre()">Valider l'offre et ajouter une photo</button>
    </div>

    <!-- Upload photo -->
    <div id="section-upload" style="display:none">
      <h2>Ajouter une photo</h2>
      <input type="file" id="photo-input" accept="image/*">
      <div id="apercu"></div>
      <button onclick="soumettrePhoto()">Envoyer la photo</button>
      <div id="upload-status"></div>
      <button onclick="nouvelleOffre()" style="background:#555; margin-top:12px;">Publier une autre offre</button>
    </div>
  </div>

  <script>
    const BACKEND = 'https://nc-deals-backend-production.up.railway.app';
    let fournisseurId = null;
    let offreId = null;

    window.onload = function () {
      const id = localStorage.getItem('nc_id');
      const nom = localStorage.getItem('nc_nom');
      if (id && nom) {
        fournisseurId = parseInt(id);
        afficherDashboard(nom);
      }
    };

    function afficherInscription() {
      document.getElementById('section-login').style.display = 'none';
      document.getElementById('section-register').style.display = 'block';
    }

    function afficherConnexion() {
      document.getElementById('section-register').style.display = 'none';
      document.getElementById('section-login').style.display = 'block';
    }

    function afficherDashboard(nom) {
      document.getElementById('section-login').style.display = 'none';
      document.getElementById('section-register').style.display = 'none';
      document.getElementById('section-dashboard').style.display = 'block';
      document.getElementById('nom-fournisseur').textContent = nom;
    }

    function seDeconnecter() {
      localStorage.removeItem('nc_token');
      localStorage.removeItem('nc_nom');
      localStorage.removeItem('nc_id');
      location.reload();
    }

    async function seConnecter() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      document.getElementById('login-erreur').textContent = '';
      const res = await fetch(BACKEND + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { document.getElementById('login-erreur').textContent = data.error; return; }
      localStorage.setItem('nc_token', data.token);
      localStorage.setItem('nc_nom', data.nom);
      localStorage.setItem('nc_id', data.id);
      fournisseurId = data.id;
      afficherDashboard(data.nom);
    }

    async function sInscrire() {
      const nom = document.getElementById('reg-nom').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const iban = document.getElementById('reg-iban').value;
      const bic = document.getElementById('reg-bic').value;
      document.getElementById('register-erreur').textContent = '';
      const res = await fetch(BACKEND + '/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nom, email, password, iban, bic })
      });
      const data = await res.json();
      if (!res.ok) { document.getElementById('register-erreur').textContent = data.error; return; }
      localStorage.setItem('nc_token', data.token);
      localStorage.setItem('nc_nom', data.nom);
      localStorage.setItem('nc_id', data.id);
      fournisseurId = data.id;
      afficherDashboard(data.nom);
    }

    async function publierOffre() {
      const titre = document.getElementById('offre-titre').value;
      const description = document.getElementById('offre-description').value;
      const prix = parseInt(document.getElementById('offre-prix').value);
      document.getElementById('offre-erreur').textContent = '';
      if (!titre || !prix) { document.getElementById('offre-erreur').textContent = 'Titre et prix obligatoires.'; return; }
      const res = await fetch(BACKEND + '/api/offres', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ titre, description, prix_xpf: prix, fournisseur_id: fournisseurId })
      });
      const data = await res.json();
      if (!res.ok) { document.getElementById('offre-erreur').textContent = 'Erreur : ' + data.error; return; }
      offreId = data.id;
      document.getElementById('section-offre').style.display = 'none';
      document.getElementById('section-upload').style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', function () {
      const input = document.getElementById('photo-input');
      if (input) {
        input.addEventListener('change', function () {
          const apercu = document.getElementById('apercu');
          apercu.innerHTML = '';
          if (this.files[0]) {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(this.files[0]);
            img.style = 'max-width:200px; margin-top:10px; border-radius:6px;';
            apercu.appendChild(img);
          }
        });
      }
    });

    async function soumettrePhoto() {
      const fichier = document.getElementById('photo-input').files[0];
      if (!fichier) { alert('Choisissez une photo.'); return; }
      document.getElementById('upload-status').textContent = 'Upload en cours...';
      const form = new FormData();
      form.append('file', fichier);
      form.append('upload_preset', 'nc-deals-offres');
      const upRes = await fetch('https://api.cloudinary.com/v1_1/dphws2zzq/image/upload', { method: 'POST', body: form });
      const result = await upRes.json();
      await fetch(BACKEND + '/api/photos/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ public_id: result.public_id, url: result.secure_url, offre_id: offreId })
      });
      document.getElementById('upload-status').textContent = 'Photo envoyee ! En attente de moderation admin.';
      document.getElementById('photo-input').value = '';
      document.getElementById('apercu').innerHTML = '';
    }

    function nouvelleOffre() {
      offreId = null;
      document.getElementById('offre-titre').value = '';
      document.getElementById('offre-description').value = '';
      document.getElementById('offre-prix').value = '';
      document.getElementById('section-upload').style.display = 'none';
      document.getElementById('section-offre').style.display = 'block';
    }
  </script>
</body>
</html>
