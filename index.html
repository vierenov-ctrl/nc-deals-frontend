<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NC Deals</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    header { background: #00843D; color: white; padding: 20px; text-align: center; }
    header h1 { font-size: 2rem; }
    header p { margin-top: 5px; opacity: 0.9; }
    nav { background: #006830; padding: 10px; text-align: center; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .offres-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .offre-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .offre-card img { width: 100%; height: 180px; object-fit: cover; background: #ddd; }
    .offre-card .info { padding: 15px; }
    .offre-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .offre-card .prix { color: #00843D; font-size: 1.3rem; font-weight: bold; }
    .badge { background: #FF6B00; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; display: inline-block; margin-bottom: 8px; }
    footer { text-align: center; padding: 20px; color: #666; margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>NC Deals</h1>
    <p>Les meilleures offres de Nouvelle-Calédonie</p>
  </header>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="fournisseur.html">Espace fournisseur</a>
    <a href="admin.html">Admin</a>
  </nav>
  <div class="container">
    <h2 style="margin: 20px 0;">Offres du moment</h2>
    <div class="offres-grid" id="offres-container">
      <p>Chargement des offres...</p>
    </div>
  </div>
  <footer>NC Deals &copy; 2026 — Nouvelle-Calédonie</footer>
  <script>
    const BACKEND = 'https://nc-deals-backend-production.up.railway.app';
    async function chargerOffres() {
      try {
        const res = await fetch(BACKEND + '/api/offres');
        const offres = await res.json();
        const container = document.getElementById('offres-container');
        if (offres.length === 0) {
          container.innerHTML = '<p>Aucune offre disponible pour le moment.</p>';
          return;
        }
        container.innerHTML = offres.map(o => `
          <div class="offre-card">
            <img src="${o.photo_url || ''}" alt="${o.titre}" onerror="this.style.display='none'">
            <div class="info">
              <span class="badge">Deal</span>
              <h3>${o.titre}</h3>
              <p style="color:#666;margin-bottom:10px">${o.description || ''}</p>
              <div class="prix">${o.prix_xpf ? o.prix_xpf.toLocaleString() + ' XPF' : 'Prix sur demande'}</div>
            </div>
          </div>
        `).join('');
      } catch(e) {
        document.getElementById('offres-container').innerHTML = '<p>Erreur de chargement.</p>';
      }
    }
    chargerOffres();
  </script>
</body>
</html>
