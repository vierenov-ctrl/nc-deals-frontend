<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NC Deals — Paiement confirmé</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f0; color: #1a3a1a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .carte { background: white; border-radius: 20px; padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.1); }
    .icone { font-size: 4rem; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 900; color: #1a6b3a; margin-bottom: 12px; }
    p { color: #555; font-size: 0.97rem; line-height: 1.6; margin-bottom: 8px; }
    .ref { font-size: 0.78rem; color: #bbb; margin-top: 20px; word-break: break-all; }
    .btn { display: inline-block; margin-top: 28px; padding: 14px 32px; background: #1a6b3a; color: white; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 1rem; transition: background 0.2s; }
    .btn:hover { background: #0d4a2a; }
  </style>
</head>
<body>
  <div class="carte">
    <div class="icone">✅</div>
    <h1>Paiement confirmé !</h1>
    <p>Merci pour votre achat sur <strong>NC Deals</strong>.</p>
    <p>Un email de confirmation vous a été envoyé.</p>
    <div class="ref" id="ref"></div>
    <a href="index.html" class="btn">← Retour aux offres</a>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var sessionId = params.get('session_id');
    if (sessionId) {
      document.getElementById('ref').textContent = 'Référence : ' + sessionId;
    }
  </script>
</body>
</html>
