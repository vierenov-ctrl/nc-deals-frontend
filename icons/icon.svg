<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082218"/>
      <stop offset="55%" stop-color="#1a6b3a"/>
      <stop offset="100%" stop-color="#0d4a6b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#c8960a"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Cercle déco haut droite -->
  <circle cx="440" cy="72" r="130" fill="rgba(126,232,162,0.07)"/>
  <!-- Cercle déco bas gauche -->
  <circle cx="72" cy="440" r="110" fill="rgba(13,74,107,0.12)"/>

  <!-- "NC" grand en vert mint -->
  <text x="256" y="205"
        font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
        font-weight="900"
        font-size="235"
        fill="#7ee8a2"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-8">NC</text>

  <!-- Séparateur doré : ligne - diamant - ligne -->
  <rect x="90" y="294" width="140" height="5" rx="3" fill="url(#gold)" opacity="0.9"/>
  <text x="256" y="310"
        font-family="Arial, sans-serif"
        font-size="32"
        fill="url(#gold)"
        text-anchor="middle"
        dominant-baseline="middle">◆</text>
  <rect x="282" y="294" width="140" height="5" rx="3" fill="url(#gold)" opacity="0.9"/>

  <!-- "DEALS" en or -->
  <text x="256" y="400"
        font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
        font-weight="900"
        font-size="105"
        fill="url(#gold)"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="6">DEALS</text>

  <!-- Points déco bas -->
  <circle cx="140" cy="462" r="10" fill="rgba(212,175,55,0.35)"/>
  <circle cx="256" cy="470" r="6" fill="rgba(126,232,162,0.3)"/>
  <circle cx="372" cy="462" r="10" fill="rgba(212,175,55,0.35)"/>
</svg>
